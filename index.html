<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>간단한 할 일 앱 (단일파일)</title>
    <style>
      /* 기본 레이아웃과 스타일 (초보자용 간단한 스타일) */
      :root{--accent:#6b46c1;--muted:#6b7280}
      *{box-sizing:border-box}
      body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans KR',sans-serif;background:#f3f4f6;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
      .app{width:100%;max-width:640px;background:#fff;border-radius:12px;padding:20px;box-shadow:0 8px 30px rgba(15,23,42,0.06)}
      h1{margin:0 0 12px;color:var(--accent)}
      form{display:flex;gap:8px;margin-bottom:12px}
      input[type="text"]{flex:1;padding:10px;border:1px solid #e5e7eb;border-radius:8px}
      button{background:var(--accent);color:#fff;border:0;padding:10px 14px;border-radius:8px;cursor:pointer}
      ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
      li{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #f0f0f0;border-radius:8px}
      li.completed span{opacity:0.6;text-decoration:line-through}
      .btn-del{background:transparent;border:0;color:var(--muted);cursor:pointer}
      .info{margin-top:12px;color:var(--muted);text-align:right}
    </style>
  </head>
  <body>
    <main class="app">
      <h1>간단한 할 일 앱</h1>

      <!-- 할 일 입력 폼 -->
      <form id="task-form">
        <input id="task-input" type="text" placeholder="새 할 일을 입력하세요...">
        <button type="submit">추가</button>
      </form>

      <!-- 할 일 목록이 표시되는 영역 -->
      <ul id="task-list"></ul>

      <!-- 하단 정보: 전체 개수 표시 -->
      <div class="info">총 <span id="count">0</span>개</div>
    </main>

    <script>
      /**
       * 초보자용 설명:
       * 이 스크립트는 브라우저에서 동작하는 간단한 할 일 앱입니다.
       * 기능: 추가, 완료 표시, 삭제, 페이지 새로고침 후에도 유지(localStorage 사용)
       */

      // DOM 요소 가져오기
      const form = document.getElementById('task-form')
      const input = document.getElementById('task-input')
      const list = document.getElementById('task-list')
      const countEl = document.getElementById('count')

      // 할 일 데이터를 저장하는 배열 (각 항목은 {id, text, done})
      let tasks = []

      // localStorage 키 (브라우저에 데이터를 저장할 때 사용)
      const STORAGE_KEY = 'simple_todo_v1'

      // 페이지가 처음 로드될 때 로컬스토리지에서 저장된 항목을 불러옵니다.
      function loadTasks(){
        const raw = localStorage.getItem(STORAGE_KEY)
        if(raw){
          try{
            tasks = JSON.parse(raw)
          }catch(e){
            tasks = []
          }
        }
      }

      // 현재 tasks 배열을 로컬스토리지에 저장합니다.
      function saveTasks(){
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks))
      }

      // 고유 id 생성 (간단한 방법)
      function uid(){
        return Date.now().toString(36) + Math.random().toString(36).slice(2,6)
      }

      // 화면에 할 일 목록을 다시 그립니다.
      function render(){
        // 목록 비우기
        list.innerHTML = ''

        // 각 할 일을 li 요소로 만들어 추가
        tasks.forEach(task => {
          const li = document.createElement('li')
          if(task.done) li.classList.add('completed')

          // 체크박스: 완료 토글
          const cb = document.createElement('input')
          cb.type = 'checkbox'
          cb.checked = !!task.done
          cb.addEventListener('change', ()=>{
            task.done = cb.checked
            saveTasks()
            render()
          })

          // 텍스트 표시용 span
          const span = document.createElement('span')
          span.textContent = task.text

          // 삭제 버튼
          const del = document.createElement('button')
          del.textContent = '삭제'
          del.className = 'btn-del'
          del.addEventListener('click', ()=>{
            tasks = tasks.filter(t => t.id !== task.id)
            saveTasks()
            render()
          })

          li.appendChild(cb)
          li.appendChild(span)
          li.appendChild(del)
          list.appendChild(li)
        })

        // 개수 업데이트
        countEl.textContent = tasks.length
      }

      // 폼 제출 처리: 새로운 할 일 추가
      form.addEventListener('submit', (e)=>{
        e.preventDefault() // 페이지 새로고침 방지
        const text = input.value.trim()
        if(!text) return // 빈 값이면 아무 동작 없음

        const task = { id: uid(), text, done: false }
        // 새 항목을 앞에 추가하려면 unshift, 뒤에 추가하려면 push
        tasks.push(task)
        input.value = '' // 입력 필드 초기화
        saveTasks()
        render()
      })

      // 초기화: 저장된 데이터 불러오고 화면에 표시
      loadTasks()
      render()
    </script>
  </body>
</html>
